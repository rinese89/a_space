deconfliction_manager_node:
  ros__parameters:
    detected_collision_trajectories_topic: /detected_collision_trajectories

    # Full virtual-net discretization. Required to construct the cropped route
    # without reimplementing the virtual-net projection inside this node.
    net_loaded_trajectories_topic: /net_loaded_trajectories

    requested_supervision_trajectories_topic: /requested_supervision_trajectories
    manual_adjustment_trajectories_topic: /manual_adjustment_trajectories
    deconfliction_markers_topic: /deconfliction_manager_markers

    # Only UNIQUE collision node IDs are counted.
    # Partial mission repetitions do not increase this value when they traverse
    # the same lattice collision geometry again.
    #
    # nodes < threshold  -> requested supervision
    # nodes >= threshold -> manual adjustment
    collision_node_threshold: 30

    publish_period_ms: 1000

    supervision_node_scale: 0.30
    supervision_text_height: 0.28
    supervision_crop_line_width: 0.12

    manual_line_width: 0.14
    manual_text_height: 0.36
