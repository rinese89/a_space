# Configuración maestra del lanzamiento de uno o varios UAS.
#
# La geometría de las flight zones se crea previamente mediante
# flight_zone_manager. Este fichero únicamente define la asignación lógica
# UAS -> flight_zone_id.
#
# El launch permite sobrescribir:
#   num_uas, start_id, start_agent, start_bridge y flight_zone_id.

uas_bringup:

  use_sim_time: true

  group:
    num_uas: 1
    start_id: 1
    namespace_prefix: ua_

  # -------------------------------------------------------------------------
  # Asignación UAS -> flight zone
  #
  # Prioridad aplicada por el launch:
  #   1. Argumento flight_zone_id:=...
  #   2. Entrada assignments por namespace, por ejemplo ua_1
  #   3. Entrada assignments por id, por ejemplo "1"
  #   4. default_zone_id
  #
  # La existencia geométrica de la zona se validará posteriormente mediante
  # el gestor/monitor de asignaciones. En esta fase se valida que el
  # identificador no esté vacío cuando required=true.
  # -------------------------------------------------------------------------
  flight_zone_assignment:
    required: true
    default_zone_id: test

    assignments:
      ua_1: test

      # También se admite el id como clave:
      # "3": inspection_1

  px4:
    directory: /home/rinese/PX4-Autopilot
    binary: build/px4_sitl_default/bin/px4
    sys_autostart: 4001
    sim_model: gz_x500
    standalone_gazebo: true

    # El id del UAS coincide con MAV_SYS_ID:
    #   ua_1, id=1 -> PX4 instance 0
    #   ua_2, id=2 -> PX4 instance 1
    instance_offset: -1

    start_delay_s: 1.0
    stagger_s: 0.35

  spawn:
    # Posición del primer UAS en map/Gazebo.
    origin: [0.0, 0.0, 0.0]

    # Separación entre columnas, filas y altura incremental.
    spacing: [3.0, 3.0, 0.0]
    row_length: 5

    # Orientación inicial del vehículo en Gazebo.
    # No se aplica a map -> odom; la actitud aparece en la odometría.
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

  micro_ros_agent:
    start: true
    transport: udp4
    port: 8888

  gazebo_bridge:
    start: true
    node_name: gz_parameter_bridge

    # Vacío = usar config/gz_bridge.yaml del paquete.
    config_file: ""

  drone_odom_broadcaster:
    enabled: true

    start_delay_s: 3.0
    stagger_s: 0.10

    # Nombres relativos dentro del namespace ua_N.
    vehicle_odometry_topic: fmu/out/vehicle_odometry
    odom_topic: odom
    reset_service: reset_odom_srv

    # El nodo genera ua_N/odom y ua_N/base_link.
    odom_frame: odom
    base_frame: base_link

  robot_state_publisher:
    enabled: true

    # Vacío = usar urdf/x500_base.urdf del paquete.
    urdf_file: ""
    publish_frequency: 30.0
