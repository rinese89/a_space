static_trajectory_manager:
  frame_id: map

  flight_zone_validation_step_m: 0.25
  flight_zone_boundary_tolerance_m: 0.03
  flight_zone_boundary_is_inside: true

  marker_line_width: 0.12
  marker_text_height: 0.32

  trajectories:
    - trajectory_id: inspection_ua_ins_1
      priority: 1

      ua_id: 1
      uas_namespace: ua_ins_1
      flight_zone_id: inspection_1
      frame_id: map
      action_name: /inspection_1/ua_ins_1/follow_waypoints

      goal_tolerance: 0.12
      slowdown_radius: 0.20

      repetitions: 5
      operation_frequency: 300.0
      total_repetitions: 3

      average_speed_mps: 2.0
      operation_start_utc: "2026-09-07T19:18:00Z"

      takeoff:
        x: [3.0, 3.0]
        y: [3.0, 3.0]
        z: [0.0, 5.0]

      # NEW FORMAT:
      # mission is a sequence of independent continuous polylines.
      # There is NO implicit edge between the end of mission[0] and the start
      # of mission[1].
      mission:
        - x: [3.0, 3.0, 12.0, 12.0, 3.0, 3.0]
          y: [3.0, 7.0, 7.0, 6.0, 6.0, 3.0]
          z: [5.0, 5.0, 5.0, 5.0, 5.0, 5.0]

      landing:
        x: [3.0, 3.0]
        y: [3.0, 3.0]
        z: [5.0, 0.0]

    - trajectory_id: inspection_ua_ins_2
      priority: 2

      ua_id: 2
      uas_namespace: ua_ins_2
      flight_zone_id: inspection_1
      frame_id: map
      action_name: /inspection_1/ua_ins_2/follow_waypoints

      goal_tolerance: 0.12
      slowdown_radius: 0.20

      repetitions: 5
      operation_frequency: 300.0
      total_repetitions: 3

      average_speed_mps: 2.0
      operation_start_utc: "2026-09-07T19:18:00Z"

      takeoff:
        x: [6.0, 6.0]
        y: [3.0, 3.0]
        z: [0.0, 5.0]

      # NEW FORMAT:
      # mission is a sequence of independent continuous polylines.
      # There is NO implicit edge between the end of mission[0] and the start
      # of mission[1].
      mission:

        - x: [6.0, 6.0, 12.0, 12.0, 6.0]
          y: [3.0, 7.0, 7.0, 3.0, 3.0]
          z: [5.0, 5.0, 5.0, 5.0, 5.0]

      landing:
        x: [6.0, 6.0]
        y: [3.0, 3.0]
        z: [5.0, 0.0]
