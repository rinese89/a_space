/**/control_manager_node:
  ros__parameters:
    active_trajectories_topic: /active_trajectories

    # Relative interfaces under /<flight_zone>/<uas>/
    odom_frame_suffix: odom
    arm_takeoff_service_suffix: arm_takeoff
    follow_waypoints_action_suffix: follow_waypoints
    operator_service_suffix: trajectory_control

    tick_period_ms: 100
    retry_period_ms: 500
    service_wait_timeout_ms: 50
    service_yaw_rad: 0.0
    action_wait_timeout_ms: 50
    max_start_lateness_s: 5.0
    transform_timeout_s: 0.20

    # Feedback-based mission corridor monitoring.
    max_path_deviation_m: 1.0
    deviation_grace_period_s: 1.0
    deviation_hold_time_s: 0.75

    max_completed_keys: 128
